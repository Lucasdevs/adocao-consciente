spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adocao}
    username: ${DB_USER:adocao}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.springframework.web: INFO
    org.springframework.boot.autoconfigure: INFO
    org.hibernate.SQL: INFO
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
