services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: adocao
      POSTGRES_USER: adocao
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adocao -d adocao"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
